<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cathedral</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cathedral">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scaler">
    <div id="stage">

      <section id="intro">
        <img id="introphoto" src="assets/intro.svg" alt="Cathedral board game">
        <div id="introtitle">Cathedral</div>
        <div id="introsub">the game of the mediaeval city</div>
        <a id="howto" href="rules.html" target="_blank" rel="noopener">How to Play</a>
        <a id="wikilink" href="https://en.wikipedia.org/wiki/Cathedral_(board_game)" target="_blank" rel="noopener">about the game</a>
        <label id="namelabel" for="namefield">Name:</label>
        <input id="namefield" autocomplete="off" maxlength="20" spellcheck="false">
        <label id="opplabel" for="oppfield">Opponent:</label>
        <input id="oppfield" autocomplete="off" maxlength="20" spellcheck="false">
        <label id="ruleslabel"><input type="checkbox" id="ruleschk" checked> enforce the rules</label>
        <div id="playbtn" role="button" tabindex="0" aria-label="play">
          <svg width="18" height="19" viewBox="0 0 12.9 13.75">
            <path d="M3.3 3.2 L3.3 0 12.9 6.8 3.3 13.75 3.3 10.4 0 10.35 0 3.2 3.3 3.2" fill="#ffffff"/>
          </svg>
        </div>
        <div id="aibtn" role="button" tabindex="0">
          <span class="dot"><svg width="12" height="12" viewBox="0 0 12 12">
            <circle cx="6" cy="1.2" r="1" fill="#fff"/>
            <rect x="5.6" y="1.5" width="0.8" height="2" fill="#fff"/>
            <rect x="1" y="3.5" width="10" height="7.5" rx="1.5" fill="#fff"/>
            <circle cx="4.2" cy="6.6" r="1.1" fill="#333"/>
            <circle cx="7.8" cy="6.6" r="1.1" fill="#333"/>
            <rect x="3.5" y="8.8" width="5" height="1" rx="0.5" fill="#333"/>
          </svg></span><span class="lbl">Play vs. Computer</span>
        </div>
      </section>

      <section id="game" hidden>
        <div id="credits">
          <span class="l1">Cathedral</span>
          <span class="l2">game &copy; Chrisbo I.P. Holdings Limited</span>
          <span class="l2">code by Daniel Drucker dmd@3e.org</span>
          <span class="l3">rotate: &#8635; button, double-tap, or SPACE</span>
        </div>
        <img id="board" src="assets/board.svg" alt="">
        <div id="territory"></div>
        <div id="pieces"></div>
        <div id="failnotice">WARNING: NOT CONNECTED</div>
        <div id="gamemsg"></div>
        <div id="youlabel" class="sidelabel" hidden>&#9660; YOU &#9660;</div>
        <div id="complabel" class="sidelabel" hidden>&#9660; COMPUTER &#9660;</div>
        <div id="endturn" role="button" tabindex="0">
          <span class="dot">&#10003;</span><span class="lbl">end turn</span>
        </div>
        <div id="rotatebtn" role="button" tabindex="0" aria-label="rotate selected piece">
          <span class="dot">&#8635;</span><span class="lbl">rotate</span>
        </div>
        <div id="resetbtn" role="button" tabindex="0">
          <span class="dot">&#8634;</span><span class="lbl">reset</span>
        </div>
        <div id="mutebtn" role="button" tabindex="0" aria-label="toggle sound">
          <span class="dot">&#9834;</span><span class="lbl">mute</span>
        </div>
        <div id="opstatus"></div>
        <div id="netscore"></div>
      </section>

    </div>
  </div>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
